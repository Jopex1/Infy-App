      <line x1="170" y1="35" x2="170" y2="45" stroke="#027027" stroke-width="1" opacity="0.2"/>
      <line x1="165" y1="40" x2="175" y2="40" stroke="#027027" stroke-width="1" opacity="0.2"/>

