      <rect x="50" y="50" width="30" height="18" rx="9" fill="none" stroke="#027027" stroke-width="1" opacity="0.25"/>
      <circle cx="50" cy="68" r="3" fill="none" stroke="#027027" stroke-width="1" opacity="0.25"/>
      <rect x="120" y="120" width="30" height="18" rx="9" fill="none" stroke="#027027" stroke-width="1" opacity="0.25"/>
